<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230071e3%22/%3E%3Cpath d=%22M9 11c0-2 3-3.5 7-3.5s7 1.5 7 3.5v10c0 2-3 3.5-7 3.5s-7-1.5-7-3.5z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/%3E%3Cpath d=%22M9 11c0 2 3 3.5 7 3.5s7-1.5 7-3.5M9 16c0 2 3 3.5 7 3.5s7-1.5 7-3.5%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/%3E%3C/svg%3E" />
    <title>PostgreSQL Bootcamp</title>
    <script>
      // Apply the theme before first paint to avoid a flash. Follows the system setting unless the
      // reader picked one with the toggle (stored as 'light' or 'dark').
      let dark = matchMedia('(prefers-color-scheme: dark)').matches;
      try {
        const saved = localStorage.getItem('pgb.theme');
        if (saved === 'light' || saved === 'dark') dark = saved === 'dark';
      } catch {}
      document.documentElement.classList.toggle('dark', dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
